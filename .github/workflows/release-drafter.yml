name: Release Drafter Master
on:
  push:
    branches:
      - master
jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7.7.0
        with:
          config-name: 'release-drafter-master.yml'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
